<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No static description/og:*/twitter:* tags here on purpose (F13): every route renders
      its own <SEO> (src/components/SEO.tsx, react-helmet-async), and Helmet only replaces
      tags it rendered itself -- a static duplicate left here would keep winning
      document.querySelector('meta[name="description"]') (first-match) forever, silently
      shadowing every page's real per-page values. Keep this file to only the handful of
      tags that are genuinely page-independent (charset/viewport/icons/theme) or that must
      exist before any JS runs (title, as a last-resort fallback if JS fails entirely).
    -->
    <title>Ethiopian Youth Global Network (EYGN) | Connecting and Empowering Youth Worldwide</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1a2805" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#ffffff] text-[#1a2805] antialiased selection:bg-[#f3a310]/30 selection:text-[#1a2805]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
